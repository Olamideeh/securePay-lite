spring.application.name=securepay

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/securepay_db}
spring.datasource.username=${DB_USERNAME:securepay_user}
spring.datasource.password=${DB_PASSWORD:securepay_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
securepay.admin.username=${ADMIN_USERNAME:admin}
securepay.admin.password=${ADMIN_PASSWORD:change-me-local-only}